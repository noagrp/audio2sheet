<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Audio2Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>.waveform-bar{transition:height .05s ease}</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">
<header class="border-b border-slate-800 bg-slate-950/50 px-6 py-4"><div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4"><div><h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Audio Transcriber</h1><p class="text-xs text-slate-400 mt-0.5">Translate your singing or whistling into notes and beats</p></div><div class="flex items-center gap-6 bg-slate-900/80 p-2 rounded-xl border border-slate-800"><div class="flex flex-col"><label for="bpmInput" class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Target BPM</label><div class="flex items-center gap-2"><input type="number" id="bpmInput" value="120" min="60" max="200" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-sm font-mono focus:outline-none focus:border-emerald-500 text-center"><span class="text-xs text-slate-500">♩</span></div></div><div class="w-px h-8 bg-slate-800"></div><div class="flex flex-col"><span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Notation Style</span><div class="flex bg-slate-800 p-0.5 rounded border border-slate-700"><button id="notationSolfege" class="px-2 py-0.5 text-xs rounded font-medium bg-emerald-500 text-slate-950 transition">Do-Re-Mi</button><button id="notationLetters" class="px-2 py-0.5 text-xs rounded font-medium text-slate-400 hover:text-slate-200 transition">C-D-E</button></div></div></div></div></header>
<main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 flex flex-col gap-8"><section class="bg-slate-950/40 border border-slate-800/80 rounded-2xl p-6 flex flex-col items-center justify-center text-center relative overflow-hidden"><div class="relative z-10 flex flex-col items-center max-w-md w-full"><div id="recordingStatus" class="text-sm font-medium text-slate-400 mb-2 flex items-center gap-2"><span class="inline-block w-2 h-2 rounded-full bg-slate-600 animate-pulse"></span> Ready to capture</div><div id="liveNoteDisplay" class="text-5xl font-black tracking-tight text-slate-600 h-16 flex items-center justify-center transition-all">--</div><div id="visualizer" class="flex items-end justify-center gap-1 w-full h-12 my-4 opacity-40 transition-opacity"><div class="w-1.5 h-2 bg-gradient-to-t from-emerald-500 to-cyan-400 rounded-full waveform-bar"></div><div class="w-1.5 h-4 bg-gradient-to-t from-emerald-500 to-cyan-400 rounded-full waveform-bar"></div><div class="w-1.5 h-1 bg-gradient-to-t from-emerald-500 to-cyan-400 rounded-full waveform-bar"></div><div class="w-1.5 h-6 bg-gradient-to-t from-emerald-500 to-cyan-400 rounded-full waveform-bar"></div><div class="w-1.5 h-3 bg-gradient-to-t from-emerald-500 to-cyan-400 rounded-full waveform-bar"></div></div><div class="flex items-center gap-4 mt-2"><button id="recordBtn" class="px-6 py-3 rounded-xl font-semibold bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 active:scale-[0.98] transition cursor-pointer flex items-center gap-2"><svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg> Start Recording</button><button id="demoBtn" class="px-4 py-3 rounded-xl font-medium text-xs text-slate-400 border border-slate-800 transition cursor-pointer">Simulate Demo Data</button></div></div></section><section class="grid md:grid-cols-2 gap-6"><div class="bg-slate-950/20 border border-slate-800 rounded-xl p-5 flex flex-col justify-between min-h-[280px]"><div><div class="flex items-center justify-between mb-3"><h2 class="text-sm font-semibold tracking-wide text-slate-300 uppercase">1. Note Sheet</h2><span class="text-[10px] px-2 py-0.5 bg-slate-800 border border-slate-700/60 rounded text-slate-400 uppercase font-mono" id="badgeNotation">Solfège</span></div><div id="noteSheetBox" class="bg-slate-950/60 p-4 rounded-lg font-mono text-sm leading-relaxed text-slate-300 break-words h-40 overflow-y-auto"></div></div><button id="downloadNotes" disabled class="mt-4 w-full py-2.5 rounded-lg border border-slate-800 font-medium text-sm text-slate-500">Download Notes (.txt)</button></div><div class="bg-slate-950/20 border border-slate-800 rounded-xl p-5 flex flex-col justify-between min-h-[280px]"><div><div class="flex items-center justify-between mb-3"><h2 class="text-sm font-semibold tracking-wide text-slate-300 uppercase">2. Beat Sheet</h2><span class="text-[10px] px-2 py-0.5 bg-slate-800 border border-slate-700/60 rounded text-slate-400 uppercase font-mono">Durations</span></div><div id="beatSheetBox" class="bg-slate-950/60 p-4 rounded-lg font-mono text-sm leading-relaxed text-slate-300 break-words h-40 overflow-y-auto"></div></div><button id="downloadBeats" disabled class="mt-4 w-full py-2.5 rounded-lg border border-slate-800 font-medium text-sm text-slate-500">Download Beats (.txt)</button></div></section></main>
<footer class="border-t border-slate-800/60 bg-slate-950/20 py-4 px-6 text-center text-xs text-slate-500">Tip: Sing or whistle clear, steady notes for cleaner transcription.</footer>
<script>
const noteStringsLetters=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteStringsSolfege=['do','do#','re','re#','mi','fa','fa#','sol','sol#','la','la#','si'];
let isRecording=false,activeNotation='solfege',audioContext=null,analyser=null,micStream=null,animationFrameId=null,sampleRate=44100,transcribedData=[],currentNoteStart=null,currentNoteIndex=null,silenceThresholdCounter=0;
const recordBtn=document.getElementById('recordBtn'),demoBtn=document.getElementById('demoBtn'),bpmInput=document.getElementById('bpmInput'),notationSolfege=document.getElementById('notationSolfege'),notationLetters=document.getElementById('notationLetters'),badgeNotation=document.getElementById('badgeNotation'),recordingStatus=document.getElementById('recordingStatus'),liveNoteDisplay=document.getElementById('liveNoteDisplay'),visualizer=document.getElementById('visualizer'),visualizerBars=document.querySelectorAll('.waveform-bar'),noteSheetBox=document.getElementById('noteSheetBox'),beatSheetBox=document.getElementById('beatSheetBox'),downloadNotes=document.getElementById('downloadNotes'),downloadBeats=document.getElementById('downloadBeats');
notationSolfege.addEventListener('click',()=>setNotation('solfege'));notationLetters.addEventListener('click',()=>setNotation('letters'));recordBtn.addEventListener('click',toggleRecordingState);demoBtn.addEventListener('click',loadMockDemoSequence);downloadNotes.addEventListener('click',()=>triggerFileTxtDownload('notes'));downloadBeats.addEventListener('click',()=>triggerFileTxtDownload('beats'));bpmInput.addEventListener('input',renderSheetDisplays);
function setNotation(type){activeNotation=type;const on='px-2 py-0.5 text-xs rounded font-medium bg-emerald-500 text-slate-950 transition',off='px-2 py-0.5 text-xs rounded font-medium text-slate-400 hover:text-slate-200 transition';notationSolfege.className=type==='solfege'?on:off;notationLetters.className=type==='letters'?on:off;badgeNotation.innerText=type==='solfege'?'Solfège':'Letters';renderSheetDisplays()}
function toggleRecordingState(){isRecording?stopRecordingEngine():startRecordingEngine()}
async function startRecordingEngine(){transcribedData=[];currentNoteStart=null;currentNoteIndex=null;silenceThresholdCounter=0;renderSheetDisplays();try{micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});audioContext=new(window.AudioContext||window.webkitAudioContext)();sampleRate=audioContext.sampleRate;const source=audioContext.createMediaStreamSource(micStream);analyser=audioContext.createAnalyser();analyser.fftSize=2048;source.connect(analyser);isRecording=true;visualizer.style.opacity='1';recordBtn.innerHTML='■ Stop Transcribing';recordBtn.className='px-6 py-3 rounded-xl font-semibold bg-red-500/20 border border-red-500/40 text-red-400 transition cursor-pointer';recordingStatus.innerHTML='<span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-ping"></span> Recording microphone input...';liveNoteDisplay.classList.remove('text-slate-600');liveNoteDisplay.classList.add('text-emerald-400');transcriptionLoopProcessing()}catch(err){console.error(err);alert('Could not access your microphone. Please allow microphone permission and try again.')}}
function stopRecordingEngine(){if(!isRecording)return;isRecording=false;commitCurrentTrackedNote();if(animationFrameId)cancelAnimationFrame(animationFrameId);if(micStream)micStream.getTracks().forEach(t=>t.stop());if(audioContext)audioContext.close();visualizer.style.opacity='.4';visualizerBars.forEach(b=>b.style.height='4px');recordBtn.innerHTML='<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg> Start Recording';recordBtn.className='px-6 py-3 rounded-xl font-semibold bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 active:scale-[0.98] transition cursor-pointer flex items-center gap-2';recordingStatus.innerHTML='<span class="inline-block w-2 h-2 rounded-full bg-slate-600"></span> Recording session compiled';liveNoteDisplay.innerText='--';liveNoteDisplay.className='text-5xl font-black tracking-tight text-slate-600 h-16 flex items-center justify-center transition-all';renderSheetDisplays()}
function transcriptionLoopProcessing(){if(!isRecording)return;const n=analyser.fftSize,b=new Float32Array(n);analyser.getFloatTimeDomainData(b);let sum=0;for(let i=0;i<n;i++)sum+=b[i]*b[i];const rms=Math.sqrt(sum/n);visualizerBars.forEach((bar,i)=>bar.style.height=`${Math.min(48,Math.max(4,rms*180*(1+i*4)))}px`);if(rms<.025){silenceThresholdCounter++;if(silenceThresholdCounter>20){commitCurrentTrackedNote();liveNoteDisplay.innerText='--'}}else{silenceThresholdCounter=0;const f=autoCorrelateAudioSignal(b,sampleRate);if(f!==-1&&f>60&&f<2000)processTranscribedNoteStreamInput(calculateNoteFromFrequency(f))}animationFrameId=requestAnimationFrame(transcriptionLoopProcessing)}
function autoCorrelateAudioSignal(buffer,rate){const size=buffer.length;let energy=0;for(let i=0;i<size;i++)energy+=buffer[i]*buffer[i];if(energy<.01)return-1;const max=Math.floor(size/2),corr=new Float32Array(max);for(let lag=0;lag<max;lag++)for(let i=0;i<max;i++)corr[lag]+=buffer[i]*buffer[i+lag];let start=0;while(start<max-1&&corr[start]>corr[start+1])start++;let peak=-1,offset=-1;for(let i=Math.max(1,start);i<max-1;i++)if(corr[i]>corr[i-1]&&corr[i]>corr[i+1]&&corr[i]>peak){peak=corr[i];offset=i}return offset>0?rate/offset:-1}
function calculateNoteFromFrequency(f){return Math.round(12*Math.log2(f/440))+69}
function processTranscribedNoteStreamInput(noteIndex){const now=performance.now(),r=((noteIndex%12)+12)%12;liveNoteDisplay.innerText=activeNotation==='solfege'?noteStringsSolfege[r]:noteStringsLetters[r];if(currentNoteIndex===null){currentNoteIndex=noteIndex;currentNoteStart=now}else if(currentNoteIndex!==noteIndex){commitCurrentTrackedNote();currentNoteIndex=noteIndex;currentNoteStart=now}}
function commitCurrentTrackedNote(){if(currentNoteIndex===null||currentNoteStart===null)return;const d=(performance.now()-currentNoteStart)/1000;if(d>.08){const r=((currentNoteIndex%12)+12)%12;transcribedData.push({noteIndex:currentNoteIndex,durationSeconds:d,noteNameSolfege:noteStringsSolfege[r],noteNameLetters:noteStringsLetters[r]});renderSheetDisplays()}currentNoteIndex=null;currentNoteStart=null}
function calculateBeatWeightValue(seconds,bpm){const raw=seconds/(60/bpm),grid=[4,3,2,1.5,1,.75,.5,.25];return grid.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a,1)}
function renderSheetDisplays(){if(!transcribedData.length){noteSheetBox.innerText='';beatSheetBox.innerText='';downloadNotes.disabled=true;downloadBeats.disabled=true;return}const bpm=parseFloat(bpmInput.value)||120;noteSheetBox.innerText=transcribedData.map(x=>activeNotation==='solfege'?x.noteNameSolfege:x.noteNameLetters).join(' ');beatSheetBox.innerText=transcribedData.map(x=>calculateBeatWeightValue(x.durationSeconds,bpm)).join(' ');downloadNotes.disabled=false;downloadBeats.disabled=false;[downloadNotes,downloadBeats].forEach(b=>b.className='mt-4 w-full py-2.5 rounded-lg font-semibold text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 transition cursor-pointer')}
function triggerFileTxtDownload(type){if(!transcribedData.length)return;const bpm=parseFloat(bpmInput.value)||120,list=type==='notes'?transcribedData.map(x=>activeNotation==='solfege'?x.noteNameSolfege:x.noteNameLetters):transcribedData.map(x=>calculateBeatWeightValue(x.durationSeconds,bpm)),name=type==='notes'?`note_sheet_${activeNotation}.txt`:'beat_sheet.txt',blob=new Blob([list.join(' ')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function loadMockDemoSequence(){if(isRecording)stopRecordingEngine();transcribedData=[{noteIndex:60,durationSeconds:.5,noteNameSolfege:'do',noteNameLetters:'C'},{noteIndex:62,durationSeconds:.49,noteNameSolfege:'re',noteNameLetters:'D'},{noteIndex:64,durationSeconds:.51,noteNameSolfege:'mi',noteNameLetters:'E'},{noteIndex:60,durationSeconds:.48,noteNameSolfege:'do',noteNameLetters:'C'},{noteIndex:65,durationSeconds:.98,noteNameSolfege:'fa',noteNameLetters:'F'},{noteIndex:67,durationSeconds:1.02,noteNameSolfege:'sol',noteNameLetters:'G'}];renderSheetDisplays();recordingStatus.innerHTML='<span class="inline-block w-2 h-2 rounded-full bg-cyan-400"></span> Demo melody loaded'}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
</body></html>
