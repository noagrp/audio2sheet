<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Audio2Sheet</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>.waveform-bar{transition:height .05s ease}.sheet{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body class="bg-slate-900 text-slate-100 min-h-screen font-sans"><header class="border-b border-slate-800 bg-slate-950/50 px-4 py-4"><div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:items-end justify-between gap-3"><div><h1 class="text-2xl font-bold text-emerald-400">Audio2Sheet</h1><p class="text-xs text-slate-400">Sing or whistle → Mini Studio sheet</p></div><div class="flex items-end gap-3"><label class="text-[10px] uppercase text-slate-400">BPM<input id="bpmInput" type="number" value="120" min="50" max="220" class="block mt-1 w-20 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-center"></label><div><div class="text-[10px] uppercase text-slate-400 mb-1">Pitch</div><div class="flex bg-slate-800 rounded p-0.5"><button id="notationLetters" class="px-2 py-1 text-xs rounded bg-emerald-500 text-slate-950">C4</button><button id="notationSolfege" class="px-2 py-1 text-xs rounded text-slate-400">Do-Re-Mi</button></div></div></div></div></header><main class="max-w-5xl mx-auto p-4 py-7 space-y-5"><section class="bg-slate-950/40 border border-slate-800 rounded-2xl p-6 text-center"><div id="recordingStatus" class="text-sm text-slate-400">● Ready to capture</div><div id="liveNoteDisplay" class="text-5xl font-black text-slate-600 h-16 flex items-center justify-center">--</div><div id="visualizer" class="flex items-end justify-center gap-1 h-12 my-3 opacity-40"><i class="w-1.5 h-2 bg-emerald-400 rounded waveform-bar"></i><i class="w-1.5 h-4 bg-emerald-400 rounded waveform-bar"></i><i class="w-1.5 h-1 bg-emerald-400 rounded waveform-bar"></i><i class="w-1.5 h-6 bg-emerald-400 rounded waveform-bar"></i><i class="w-1.5 h-3 bg-emerald-400 rounded waveform-bar"></i></div><div class="flex flex-wrap justify-center gap-3"><button id="recordBtn" class="px-6 py-3 rounded-xl font-semibold bg-emerald-500 text-slate-950">● Start Recording</button><button id="demoBtn" class="px-4 py-3 rounded-xl text-xs border border-slate-700">Demo</button></div></section><section class="border border-slate-800 rounded-xl p-5"><div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div><h2 class="text-sm font-semibold uppercase">Studio Sheet</h2><p class="text-xs text-slate-500">Vocal · Beats · Pitch. Blank gap = next phrase.</p></div><span id="summary" class="text-xs text-slate-500">0 events</span></div><pre id="studioSheet" class="sheet min-h-48 bg-slate-950/70 border border-slate-800 rounded-lg p-4 font-mono text-sm leading-7 text-slate-300 overflow-auto"></pre><div class="grid sm:grid-cols-3 gap-2 mt-4"><button id="downloadProject" disabled class="py-3 rounded-lg border border-slate-700 disabled:opacity-30">Download Project</button><button id="openStudio" disabled class="py-3 rounded-lg bg-emerald-500 text-slate-950 font-semibold disabled:opacity-30">Open in Mini Studio</button><button id="clearBtn" class="py-3 rounded-lg border border-slate-700">Clear</button></div></section><details class="border border-slate-800 rounded-xl"><summary class="p-4 text-xs uppercase cursor-pointer">Raw Capture</summary><div class="grid md:grid-cols-2 gap-3 p-4 pt-0"><div><div class="text-xs text-slate-500 mb-1">Notes</div><div id="noteSheetBox" class="sheet bg-slate-950 p-3 min-h-24 font-mono text-sm"></div></div><div><div class="text-xs text-slate-500 mb-1">Beats</div><div id="beatSheetBox" class="sheet bg-slate-950 p-3 min-h-24 font-mono text-sm"></div></div></div></details></main><footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">Long vocal breaks create a new phrase; they do not mean the music must stop.</footer><script>
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],S=['do','do#','re','re#','mi','fa','fa#','sol','sol#','la','la#','ti'];let isRecording=false,notation='letters',ctx=null,analyser=null,stream=null,raf=null,sampleRate=44100,data=[],curStart=null,curNote=null,silentFrames=0,lastSoundAt=null,sessionStart=0;
const $=x=>document.getElementById(x),recordBtn=$('recordBtn'),demoBtn=$('demoBtn'),bpmInput=$('bpmInput'),live=$('liveNoteDisplay'),status=$('recordingStatus'),bars=document.querySelectorAll('.waveform-bar'),studioSheet=$('studioSheet'),noteBox=$('noteSheetBox'),beatBox=$('beatSheetBox'),downloadProject=$('downloadProject'),openStudio=$('openStudio');
function name(m,sol=false){let r=((m%12)+12)%12,o=Math.floor(m/12)-1;return sol?S[r]+o:N[r]+o}function beat(sec){let raw=sec/(60/(+bpmInput.value||120)),g=[4,3,2,1.5,1,.75,.5,.25];return g.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a,1)}function fmt(x){return Number.isInteger(x)?String(x):String(x).replace(/^0/, '')}
function groups(){if(!data.length)return[];let out=[],g=[];const longGap=2*(60/(+bpmInput.value||120));data.forEach((x,i)=>{if(i&&x.start-data[i-1].end>=longGap){if(g.length)out.push(g);g=[]}g.push(x)});if(g.length)out.push(g);return out}
function project(){return{format:'noagrp-mini-music',version:1,source:'audio2sheet',bpm:+bpmInput.value||120,phrases:groups().map(g=>({vocal:g.map(()=> 'V'),beats:g.map(x=>beat(x.durationSeconds)),pitch:g.map(x=>name(x.noteIndex,false))}))}}
function render(){let p=project();noteBox.textContent=data.map(x=>notation==='letters'?name(x.noteIndex):name(x.noteIndex,true)).join(' ');beatBox.textContent=data.map(x=>fmt(beat(x.durationSeconds))).join(' ');studioSheet.textContent=p.phrases.map(q=>q.vocal.join(' ')+'\n'+q.beats.map(fmt).join(' ')+'\n'+q.pitch.join(' ')).join('\n\n');$('summary').textContent=`${data.length} events · ${p.phrases.length} phrase${p.phrases.length===1?'':'s'}`;downloadProject.disabled=openStudio.disabled=!data.length}
function commit(){if(curNote===null||curStart===null)return;let end=performance.now()/1000,d=end-curStart;if(d>.08)data.push({noteIndex:curNote,durationSeconds:d,start:curStart-sessionStart,end:end-sessionStart});curNote=curStart=null;render()}
async function start(){data=[];render();try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});ctx=new(window.AudioContext||window.webkitAudioContext)();sampleRate=ctx.sampleRate;let src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);sessionStart=performance.now()/1000;lastSoundAt=sessionStart;isRecording=true;recordBtn.textContent='■ Stop Recording';recordBtn.className='px-6 py-3 rounded-xl font-semibold border border-red-500 text-red-400 bg-red-500/10';status.textContent='● Recording microphone…';loop()}catch(e){console.error(e);alert('Could not access your microphone. Please allow microphone permission and try again.')}}function stop(){if(!isRecording)return;isRecording=false;commit();cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close();recordBtn.textContent='● Start Recording';recordBtn.className='px-6 py-3 rounded-xl font-semibold bg-emerald-500 text-slate-950';status.textContent='● Capture complete';live.textContent='--';bars.forEach(b=>b.style.height='4px');render()}
function loop(){if(!isRecording)return;let b=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(b);let sum=0;for(let v of b)sum+=v*v;let rms=Math.sqrt(sum/b.length);bars.forEach((x,i)=>x.style.height=Math.min(48,Math.max(4,rms*180*(1+i*4)))+'px');if(rms<.025){if(++silentFrames>20){commit();live.textContent='--'}}else{silentFrames=0;lastSoundAt=performance.now()/1000;let f=ac(b,sampleRate);if(f>60&&f<2000){let m=Math.round(12*Math.log2(f/440))+69,now=performance.now()/1000;live.textContent=notation==='letters'?name(m):name(m,true);if(curNote===null){curNote=m;curStart=now}else if(curNote!==m){commit();curNote=m;curStart=now}}}raf=requestAnimationFrame(loop)}
function ac(b,r){let n=b.length,e=0;for(let v of b)e+=v*v;if(e<.01)return-1;let max=n>>1,c=new Float32Array(max);for(let lag=0;lag<max;lag++)for(let i=0;i<max;i++)c[lag]+=b[i]*b[i+lag];let s=0;while(s<max-1&&c[s]>c[s+1])s++;let pk=-1,off=-1;for(let i=Math.max(1,s);i<max-1;i++)if(c[i]>c[i-1]&&c[i]>c[i+1]&&c[i]>pk){pk=c[i];off=i}return off>0?r/off:-1}
recordBtn.onclick=()=>isRecording?stop():start();demoBtn.onclick=()=>{if(isRecording)stop();data=[{noteIndex:60,durationSeconds:.5,start:0,end:.5},{noteIndex:62,durationSeconds:.5,start:.55,end:1.05},{noteIndex:64,durationSeconds:.5,start:1.1,end:1.6},{noteIndex:67,durationSeconds:1,start:1.65,end:2.65},{noteIndex:69,durationSeconds:.5,start:4.1,end:4.6},{noteIndex:67,durationSeconds:1,start:4.65,end:5.65}];render();status.textContent='● Demo loaded'};$('notationLetters').onclick=()=>{notation='letters';$('notationLetters').className='px-2 py-1 text-xs rounded bg-emerald-500 text-slate-950';$('notationSolfege').className='px-2 py-1 text-xs rounded text-slate-400';render()};$('notationSolfege').onclick=()=>{notation='solfege';$('notationSolfege').className='px-2 py-1 text-xs rounded bg-emerald-500 text-slate-950';$('notationLetters').className='px-2 py-1 text-xs rounded text-slate-400';render()};bpmInput.oninput=render;$('clearBtn').onclick=()=>{data=[];render();status.textContent='● Ready to capture'};downloadProject.onclick=()=>{let blob=new Blob([JSON.stringify(project(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='audio2sheet.mstudio';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};openStudio.onclick=()=>{localStorage.setItem('noagrpMiniMusicTransfer',JSON.stringify(project()));location.href='../ministudio/'};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));render();
</script></body></html>
